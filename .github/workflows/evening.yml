name: Gold evening orders

on:
  schedule:
    # GitHub uses UTC. 20:05 UTC = 21:05 UK in summer, 21:05 UTC = 21:05 UK in winter.
    # The script only continues for the run that lands in the 21:00 UK hour.
    - cron: "5 20,21 * * 1-5"
  workflow_dispatch:        # adds a "Run workflow" button for manual tests
    inputs:
      force:
        description: "Send a message even if it isn't 21:xx (test)"
        default: "true"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          ACCOUNT_GBP: "250"
          RISK_PCT: "1"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python bot.py --force
          else
            python bot.py
          fi
